# Serves the built Vue app. Replaces the stock OpenResty server (port 80,
# welcome page): Coolify routes to 8080.
server {
    listen 8080;
    server_name _;

    root /app;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the entry point, or a deploy would keep serving stale bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The router uses HTML5 history: unknown paths fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
