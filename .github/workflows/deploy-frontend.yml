name: Deploy frontend

# Tag the commit `frontend-<version>` (e.g. frontend-1.4.0) to ship the web client.
# The backend has its own `backend-*` tags and its own workflow.
#
# Who may deploy is enforced by the repository settings, not by this file:
# a tag ruleset restricts `frontend-*` to admins, and the `coolify` environment
# only accepts `backend-*` / `frontend-*` tags and holds the Coolify secrets.
on:
  push:
    tags:
      - 'frontend-*'

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build:
    name: Test, build and push image
    # Forks never get the repository secrets, but stopping here means a fork that
    # pushes a `frontend-*` tag does not even show a red run.
    if: github.repository == 'kerflowapp/kerflow'
    runs-on: ubuntu-latest
    # Publishing `:latest` is as good as deploying, so it sits behind the same gate.
    environment: coolify
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check and test
        working-directory: frontend
        run: |
          npm ci
          npm run type-check
          npm run test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          # frontend-1.4.0 -> 1.4.0
          tags: |
            type=match,pattern=frontend-(.*),group=1
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite inlines these into the bundle at build time, so they cannot be
          # set on the container afterwards. An undefined var resolves to an
          # empty string and simply falls back to the Dockerfile default.
          # Everything here ends up readable in the shipped JavaScript: never
          # put an actual secret behind a VITE_* name.
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}
            VITE_BACKEND_PORT=${{ vars.VITE_BACKEND_PORT }}
            VITE_POSTHOG_ENABLED=${{ vars.VITE_POSTHOG_ENABLED }}
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
            VITE_TERMS_URL=${{ vars.VITE_TERMS_URL }}
            VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}

  deploy:
    name: Trigger Coolify
    needs: build
    if: github.repository == 'kerflowapp/kerflow'
    runs-on: ubuntu-latest
    environment: coolify

    steps:
      - name: Call deployment webhook
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}
          WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request GET "$WEBHOOK_URL" \
            --header "Authorization: Bearer $WEBHOOK_TOKEN"
