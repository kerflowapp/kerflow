name: Deploy backend

# Tag the commit `backend-<version>` (e.g. backend-1.4.0) to ship the backend.
# The frontend has its own `frontend-*` tags and its own workflow.
#
# Who may deploy is enforced by the repository settings, not by this file:
# a tag ruleset restricts `backend-*` to admins, and the `coolify` environment
# only accepts `backend-*` / `frontend-*` tags and holds the Coolify secrets.
on:
  push:
    tags:
      - 'backend-*'

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build:
    name: Test, build and push image
    # Forks never get the repository secrets, but stopping here means a fork that
    # pushes a `backend-*` tag does not even show a red run.
    if: github.repository == 'kerflowapp/kerflow'
    runs-on: ubuntu-latest
    # Publishing `:latest` is as good as deploying, so it sits behind the same gate.
    environment: coolify
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test and build jar
        run: ./gradlew clean test bootJar --no-daemon

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/backend
          # backend-1.4.0 -> 1.4.0
          tags: |
            type=match,pattern=backend-(.*),group=1
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Trigger Coolify
    needs: build
    if: github.repository == 'kerflowapp/kerflow'
    runs-on: ubuntu-latest
    environment: coolify

    steps:
      - name: Call deployment webhook
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_BACKEND_WEBHOOK }}
          WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request GET "$WEBHOOK_URL" \
            --header "Authorization: Bearer $WEBHOOK_TOKEN"
